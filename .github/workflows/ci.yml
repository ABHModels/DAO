name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Fast checks
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install metadata validator
        run: python -m pip install --disable-pip-version-check "PyYAML>=6.0,<7"

      - name: Check changed-file whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA"...HEAD
          else
            git diff-tree --check --root --no-commit-id -r HEAD
          fi

      - name: Validate release metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          citation = yaml.safe_load(Path("CITATION.cff").read_text(encoding="utf-8"))
          version = str(citation["version"])
          release_date = str(citation["date-released"])
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              r"^## \[([^]]+)\] - (\d{4}-\d{2}-\d{2})$",
              changelog,
              flags=re.MULTILINE,
          )
          if match is None:
              raise SystemExit("CHANGELOG.md has no release heading")
          if (version, release_date) != match.groups():
              raise SystemExit(
                  "CITATION.cff and the latest CHANGELOG.md release do not agree: "
                  f"citation={(version, release_date)!r}, changelog={match.groups()!r}"
              )
          print(f"release metadata OK: v{version} ({release_date})")
          PY

      - name: Reject tracked local or generated files
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True
          ).splitlines()
          forbidden = []
          for name in tracked:
              path = Path(name)
              if name.endswith(".local.md"):
                  forbidden.append(name)
              if path.parts and path.parts[0] in {"results", "kernel", "comp_cs"}:
                  forbidden.append(name)
              if path.name in {"run.log", ".DS_Store"}:
                  forbidden.append(name)
          if forbidden:
              raise SystemExit("forbidden tracked files:\n" + "\n".join(sorted(set(forbidden))))
          print("tracked-file policy OK")
          PY

      - name: Check Python syntax
        run: git ls-files -z '*.py' | xargs -0 --no-run-if-empty python -m py_compile

      - name: Compile standalone Compton-kernel diagnostic
        run: make test_kernel_norm

      - name: Check Compton quadrature and low-temperature redistribution
        run: |
          make test_kernel_reference test_kernel_low_temp
          ./test_kernel_reference
          ./test_kernel_low_temp

      - name: Test run labels and summaries
        run: python tests/test_run_metadata.py

      - name: Test results and comparison UI
        run: |
          python -m pip install --disable-pip-version-check "Flask>=3,<4"
          python tests/test_ui_results.py
